<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Submit Application - EARS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a href="{{ url_for('dashboard') }}" class="navbar-brand"> EARS </a>

        <a href="{{ url_for('jobs') }}" class="btn btn-outline-light btn-sm">
          Back to Jobs
        </a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="mb-2">Apply for {{ job.title }}</h1>

              <p class="text-muted mb-4">{{ job.description }}</p>

              {% with messages = get_flashed_messages() %} {% if messages %} {%
              for message in messages %}
              <div class="alert alert-danger">{{ message }}</div>
              {% endfor %} {% endif %} {% endwith %}

              <form method="POST">
                <div class="mb-3">
                  <label for="cover_letter" class="form-label">
                    Cover Letter
                  </label>

                  <textarea
                    class="form-control"
                    id="cover_letter"
                    name="cover_letter"
                    rows="8"
                    placeholder="Explain why you are interested in this position."
                    required
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                  Submit Application
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
